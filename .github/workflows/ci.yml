# Required status check `ci` for merging into main. The job name is
# referenced by the `main-quality-gates` ruleset — renaming it breaks branch
# protection. Steps run in order; the first failure stops the job and its
# step name tells you which gate failed.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1
  # Must match E2E_API_URL in playwright.config.ts: the build bakes it in and E2E stubs it.
  NEXT_PUBLIC_API_URL: http://127.0.0.1:8999
  NEXT_PUBLIC_GOOGLE_CLIENT_ID: e2e-google-client-id

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 } # architecture check diffs against the base branch
      - uses: actions/setup-node@v5
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci

      - name: Lint (incl. MVVM boundaries)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Architecture check
        run: npm run check:architecture
        env:
          ARCH_BASE_REF: origin/${{ github.base_ref || 'main' }}
      - name: Unit tests + coverage
        run: npm run test:coverage
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            node -e 'const t=require("./coverage/coverage-summary.json").total;console.log("| metric | % |\n|---|---|\n"+["lines","statements","functions","branches"].map(k=>`| ${k} | ${t[k].pct} |`).join("\n"))' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E tests
        run: npm run test:e2e
        env:
          E2E_SKIP_BUILD: 1
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
